# Run with `dart run ffigen --config ffigen.yaml`.
name: MediaReaderBindings
description: |
  Bindings for `src/than_media_tag.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/than_media_tag_bindings_generated.dart'
headers:
  entry-points:
  - 'src/include/libavcodec/avcodec.h'
  - 'src/include/libavformat/avformat.h'
  - 'src/include/libavutil/avutil.h'
  - 'src/include/libswscale/swscale.h'
  - 'src/than_media_tag.h'
  include-directives:
  - 'src/include/libavcodec/*.h'
  - 'src/include/libavformat/*.h'
  - 'src/include/libavutil/*.h'
  - 'src/include/libswscale/*.h'
  - 'src/*.h'

# ffi-native:
comments:
  style: any
  length: full
compiler-opts:
  - "-I/home/thancoder/projects/dart_plugins/than_media_tag/src/include"
# ignore-source-errors: true
